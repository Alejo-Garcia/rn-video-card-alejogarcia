name: CI

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci rather than npm install: it installs exactly the lockfile, so a
      # green run here means the committed dependency tree is the one that works.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
